# Include this file once at Nginx `http` scope. The variables keep page titles,
# descriptions and canonical URLs accurate when legal pages are shared directly.
map $uri $pm_meta_title {
    default               "PrettyModels AI — AI Research Lab";
    /research-disclosures "Research & Risk Disclosures — PrettyModels AI";
    /legal-notice         "Legal Notice — PrettyModels AI";
    /privacy-policy       "Privacy Policy — PrettyModels AI";
}

map $uri $pm_meta_description {
    default               "PrettyModels AI studies whether large language models can evaluate public companies consistently, using a public model portfolio as an empirical test.";
    /research-disclosures "Model limitations, investment risk, performance presentation and conflicts of interest for PrettyModels AI research.";
    /legal-notice         "Provider identification, editorial responsibility and legal information for PrettyModels AI.";
    /privacy-policy       "How PrettyModels AI processes visitor and contact data, including hosting, logs, retention and GDPR rights.";
}

map $uri $pm_canonical_path {
    default               "/";
    /                     "/";
    /research-disclosures "/research-disclosures";
    /legal-notice         "/legal-notice";
    /privacy-policy       "/privacy-policy";
}
