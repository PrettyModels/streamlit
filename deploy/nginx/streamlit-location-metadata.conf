# Include this file inside the existing `location /` block, before proxy_pass.
# Disabling upstream compression lets ngx_http_sub_module edit Streamlit's shell.
proxy_set_header Accept-Encoding "";
sub_filter_once on;

# Remove the retired marketing description currently present in production.
sub_filter '<meta name="description" content="Beat the market with an AI investment manager that compounds your wealth faster than ETFs.">' '';

# Streamlit updates the title after its websocket starts. These tags make the
# correct identity available in the initial response to search/social crawlers.
sub_filter '<title>Streamlit</title>' '<title>$pm_meta_title</title><meta name="description" content="$pm_meta_description"><link rel="canonical" href="https://www.prettymodels.ai$pm_canonical_path"><meta name="theme-color" content="#3A34C0"><meta name="color-scheme" content="light"><meta property="og:type" content="website"><meta property="og:locale" content="en_US"><meta property="og:site_name" content="PrettyModels AI"><meta property="og:title" content="$pm_meta_title"><meta property="og:description" content="$pm_meta_description"><meta property="og:url" content="https://www.prettymodels.ai$pm_canonical_path"><meta property="og:image" content="https://www.prettymodels.ai/app/static/social-preview.png"><meta property="og:image:secure_url" content="https://www.prettymodels.ai/app/static/social-preview.png"><meta property="og:image:type" content="image/png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:image:alt" content="PrettyModels AI — Can AI evaluate public companies consistently?"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="$pm_meta_title"><meta name="twitter:description" content="$pm_meta_description"><meta name="twitter:image" content="https://www.prettymodels.ai/app/static/social-preview.png"><meta name="twitter:image:alt" content="PrettyModels AI — Can AI evaluate public companies consistently?"><link rel="manifest" href="/app/static/site.webmanifest"><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebSite","name":"PrettyModels AI","url":"https://www.prettymodels.ai/","description":"Public research on whether large language models can evaluate public companies consistently."}</script>';

# Replace Streamlit's generic crown before JavaScript loads.
sub_filter '<link rel="shortcut icon" href="./favicon.png" />' '<link rel="icon" href="/app/static/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/app/static/favicon-32x32.png"><link rel="icon" type="image/png" sizes="16x16" href="/app/static/favicon-16x16.png"><link rel="apple-touch-icon" sizes="180x180" href="/app/static/apple-touch-icon.png">';
