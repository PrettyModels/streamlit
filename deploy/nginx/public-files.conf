# Include at `server` scope. Nginx serves crawler and brand assets directly so
# they remain available even while Streamlit is restarting.
location ^~ /app/static/ {
    alias /opt/streamlit_app/static/;
    expires 30d;
    add_header X-Content-Type-Options "nosniff" always;
}

location = /robots.txt {
    alias /opt/streamlit_app/static/robots.txt;
    default_type text/plain;
    expires 5m;
    add_header X-Content-Type-Options "nosniff" always;
}

location = /sitemap.xml {
    alias /opt/streamlit_app/static/sitemap.xml;
    default_type application/xml;
    expires 5m;
    add_header X-Content-Type-Options "nosniff" always;
}

location = /favicon.ico {
    alias /opt/streamlit_app/static/favicon.ico;
    default_type image/x-icon;
    expires 30d;
    add_header X-Content-Type-Options "nosniff" always;
}

location = /site.webmanifest {
    alias /opt/streamlit_app/static/site.webmanifest;
    default_type application/manifest+json;
    expires 1d;
    add_header X-Content-Type-Options "nosniff" always;
}

# Normalize alternate document URLs before the Streamlit application sees them.
location = /research-disclosures/ { return 301 /research-disclosures; }
location = /legal-notice/         { return 301 /legal-notice; }
location = /privacy-policy/       { return 301 /privacy-policy; }
