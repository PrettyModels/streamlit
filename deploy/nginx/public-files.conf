# Include these exact-match locations in the canonical HTTPS `server` block.
# They keep crawler conventions at the site root while Streamlit serves the
# checked-in files from /app/static/*.
location ^~ /app/static/ {
    proxy_pass http://127.0.0.1:8501;
    proxy_set_header Host $host;
    expires 7d;
    add_header Cache-Control "public";
}

location = /robots.txt {
    proxy_pass http://127.0.0.1:8501/app/static/robots.txt;
}

location = /sitemap.xml {
    proxy_pass http://127.0.0.1:8501/app/static/sitemap.xml;
}

location = /favicon.ico {
    proxy_pass http://127.0.0.1:8501/app/static/favicon.ico;
}
